[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # package.json requires >=22.12; pin it so a default-image bump can't break the build.
  NODE_VERSION = "22"

# Astro fingerprints everything under /_astro, so it can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# These two are served verbatim from public/ with stable filenames, but the URL
# in the HTML is NOT stable: Layout.astro appends a sha256 of the file itself
# (assetVersion()), so /Style.css?v=96a8df1c becomes a different URL the moment
# a byte changes. A cached copy therefore cannot go stale, because a changed
# file is never the same URL.
#
# This used to be max-age=0 + must-revalidate, guarding against a stale
# stylesheet after deploy. That guard predates the content hash and now costs a
# revalidation round trip on the largest render-blocking asset on the site,
# every visit, to prevent something that can no longer happen. Do not put it
# back without first removing the hash from Layout.astro.
[[headers]]
  for = "/Style.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/motion.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Font files never change in place. If one is ever re-subset or replaced with a
# different cut, give it a new filename rather than editing this: the URL is the
# only cache key here, since these are not content-hashed the way /_astro is.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Nothing on this site is meant to be embedded, and clickjacking a page
    # whose whole purpose is being believed is a cheap attack. frame-ancestors
    # in the CSP below supersedes this, but that policy is REPORT-ONLY and
    # therefore enforces nothing, so this stays until it is switched over.
    X-Frame-Options = "DENY"

    # ── Content-Security-Policy ──────────────────────────────────────────────
    # REPORT-ONLY. It blocks nothing; it reports violations to the browser
    # console. To enforce it, rename this one key to `Content-Security-Policy`
    # and delete the X-Frame-Options line above. Do that after loading the site
    # once with the console open and seeing no violations.
    #
    # Built from an inventory of all 15 built pages rather than from a
    # template. What that inventory found:
    #
    #   script-src  ONE executable inline script exists, 45 characters,
    #               identical on every page, so it is hashed rather than
    #               waved through with 'unsafe-inline'. That is the whole
    #               point of the policy: script injection is the attack this
    #               defends against. Nonces are not an option on a static
    #               host, which cannot vary a header per request.
    #               scripts/check-csp.mjs fails the build if that hash and the
    #               script ever disagree.
    #
    #   style-src   'unsafe-inline' is unavoidable and deliberate. Astro
    #               inlines 7 scoped <style> blocks, and the design passes
    #               per-item data through 151 inline custom properties on the
    #               homepage alone (--brand, --pill, --r, --mid). Hashing those
    #               would break on every stylesheet edit. Style injection is a
    #               far weaker vector than script injection, which stays locked.
    #
    #   form-action buttondown.email is listed BEFORE it is used. The subscribe
    #               form renders without an action until NEWSLETTER.buttondownUser
    #               is set, and the day it is set the form would post
    #               cross-origin. Omitting it now means the newsletter signup
    #               breaks silently, weeks later, for reasons nobody connects
    #               to this file.
    #
    #   img/font/   All same-origin since the fonts were self-hosted. No data:
    #   connect     URIs, no iframes, no object/embed, and motion.js issues no
    #               network request of any kind. All verified against the build.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'sha256-/x7W7R75k8Roq0WaVRQX9blP4OufE5xbAdzklGxsgpw='; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self' https://buttondown.email; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"
