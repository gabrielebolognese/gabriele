[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # package.json requires >=22.12; pin it so a default-image bump can't break the build.
  NODE_VERSION = "22"

# Astro fingerprints everything under /_astro, so it can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# These two are served verbatim from public/ with STABLE names — no content hash
# — so a cached copy can never be invalidated by the URL changing. max-age=3600
# meant a style change was invisible for up to an hour after deploy, with the
# browser serving the old file without even asking. That is an hour of looking
# at a deploy and reporting bugs that were already fixed.
#
# max-age=0 + must-revalidate makes the browser check every time. When nothing
# changed the answer is a 304 with no body, which costs a round trip and no
# bytes. Cheap insurance against debugging a stale stylesheet.
[[headers]]
  for = "/Style.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/motion.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
